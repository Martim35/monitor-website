
name: Monitor ANDA

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: write

concurrency:
  group: monitor-anda
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar vouchers
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: python monitor_anda_github_n8n/scripts/verificar.py

      - name: Guardar estado
        run: |
          if ! git diff --quiet -- estado.json || [ -n "$(git ls-files --others --exclude-standard estado.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "Atualizar estado ANDA [skip ci]"
            git push
          else
            echo "Estado sem alterações."
          fi
